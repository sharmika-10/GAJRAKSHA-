
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Sighting | GAJRAKSHAN+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>🐘 GAJRAKSHAN+</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="reports.html">Report Sighting</a>
      <a href="alerts.html">Alerts</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Report an Elephant Sighting</h1>
      <p>
        Share the sighting details to help keep nearby communities informed.
      </p>

      <form id="sightingForm">
        <label for="location">Location</label>
        <input
          type="text"
          id="location"
          placeholder="Enter the sighting location"
          required
        >

        <label for="time">Date and Time</label>
        <input
          type="datetime-local"
          id="time"
          required
        >

        <label for="elephantCount">Number of Elephants</label>
        <input
          type="number"
          id="elephantCount"
          min="1"
          placeholder="Enter number of elephants"
          required
        >

        <button class="button" type="submit">
          Submit Sighting
        </button>

        <p id="formMessage" role="status"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>GAJRAKSHAN+ | Elephant Early Warning System</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
